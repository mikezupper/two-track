name: Release

# Publishes to npm with provenance via npm trusted publishing (OIDC): no token in secrets.
# One-time setup on npmjs.com: package settings → Trusted publisher → GitHub Actions,
# repository mikezupper/two-track, workflow release.yml. Then `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full check (same as CI)
        run: pnpm check
      - name: Tag matches package.json version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "refs/tags/v$v" = "$GITHUB_REF" ] || { echo "tag $GITHUB_REF != v$v"; exit 1; }
      - name: Publish two-track (provenance)
        run: npm publish --provenance --access public
      - name: Publish two-track-check (provenance)
        run: npm publish --provenance --access public
        working-directory: tools/check
